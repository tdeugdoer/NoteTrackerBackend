plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21' apply false
}

ext {
    // Версии библиотек, которыми не управляет Spring Boot BOM.
    // Остальные версии (Lombok, Liquibase, Kafka, PostgreSQL, Jackson, MockK-совместимые) приходят из BOM.
    mapstructVersion = '1.6.3'
    lombokMapstructBindingVersion = '0.2.0'
    springdocVersion = '3.2.0'
    // Spring Cloud 2025.1.x — ближайший стабильный релиз-трейн к Spring Boot 4.x
    springCloudVersion = '2025.1.4'
    mockkVersion = '1.14.12'
    kotestVersion = '6.2.7'
}

allprojects {
    group = 'com.tereshkevich'
    version = '0.0.1-SNAPSHOT'
}
