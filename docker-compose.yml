services:
  postgres:
    image: postgres:17-alpine
    container_name: notetracker-postgres
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notes -d notes" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: notetracker-kafka
    ports:
      - "19092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  mongo:
    image: mongo:8.0
    container_name: notetracker-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10

  note-service:
    build:
      context: .
      dockerfile: note-service/Dockerfile
    image: notetracker/note-service:0.0.1-SNAPSHOT
    container_name: notetracker-note-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notes
      DB_USERNAME: ${DB_USERNAME:-notes}
      DB_PASSWORD: ${DB_PASSWORD:-notes}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    restart: unless-stopped

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
    image: notetracker/history-service:0.0.1-SNAPSHOT
    container_name: notetracker-history-service
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      note-service:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongo:27017/history
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTES_SERVICE_URL: http://note-service:8081
      HISTORY_SERVER_PORT: 8082
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  mongo-data:
